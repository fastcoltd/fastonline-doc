<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="title" content="FastResp Chat" />
    <meta name="description" content="FastResp portable ecommerce chat UI" />
    <title>FastResp Chat</title>
    <link rel="icon" href="image/logo.jpg" type="image/x-icon" />
    <link rel="stylesheet" href="chat_ui/chat-ui.css" />
</head>

<body class="fr-chat-page">
    <!-- @include ../partials/components/chat-workspace.html -->

    <script src="chat_ui/chat-store.js"></script>
    <script src="chat_ui/chat-protocol-bridge.js"></script>
    <script src="chat_ui/chat-socket-adapter.js"></script>
    <script src="chat_ui/chat-mock-adapter.js"></script>
    <script src="chat_ui/chat-demo-data.js"></script>
    <script src="chat_ui/chat-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var data = window.FastRespChatDemoData.create({ assetBase: 'chat_ui/assets/' });
            var adapter = new window.FastRespChat.MockChatAdapter(data);
            window.fastRespChatDemo = window.FastRespChat.mount(
                document.querySelector('[data-chat-root]'),
                {
                    adapter: adapter,
                    initialData: data,
                    assetBase: 'chat_ui/assets/',
                    currentUserId: 'me'
                }
            );
        });
    </script>
</body>

</html>
